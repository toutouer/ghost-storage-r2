name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Build index.js
        run: npm run build

      - name: Ensure index.js is up to date on PRs
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet index.js; then
            echo "::error::index.js is out of sync with src/index.ts. Run 'npm run build' and commit index.js."
            git diff --stat index.js
            exit 1
          fi

      - name: Run unit tests
        run: npm test

  sync-dist:
    name: Auto-sync compiled index.js
    needs: verify
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Commit rebuilt index.js if changed
        run: |
          if git diff --quiet index.js; then
            echo "index.js is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "chore: rebuild index.js [skip ci]"
          git push origin HEAD:main
